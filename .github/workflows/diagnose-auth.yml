name: Diagnose Double Auth

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Try every credential permutation
        env:
          DOUBLE_CLIENT_ID: ${{ secrets.DOUBLE_CLIENT_ID }}
          DOUBLE_CLIENT_SECRET: ${{ secrets.DOUBLE_CLIENT_SECRET }}
        run: python3 scripts/diagnose_auth.py
